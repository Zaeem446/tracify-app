<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "wmi5ds3irc");
    </script>
    <title>Payment Successful - Tracify</title>

    <script src="/api/pixels/active"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4CAF50;
            --primary-dark: #388E3C;
            --text: #333;
            --text-light: #666;
            --bg: #f5f7fa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            margin-bottom: 30px;
        }

        .logo svg {
            width: 35px;
            height: 35px;
        }

        /* Loading state */
        .loading-state .spinner {
            border: 4px solid #e0e0e0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-state h2 {
            color: var(--text);
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .loading-state p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* Success state */
        .success-state {
            display: none;
        }

        .success-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .success-icon svg {
            width: 36px;
            height: 36px;
            color: white;
        }

        .success-state h2 {
            color: var(--text);
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        .success-state p {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .redirect-text {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        /* Error state */
        .error-state {
            display: none;
        }

        .error-icon {
            width: 70px;
            height: 70px;
            background: #ffebee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .error-icon svg {
            width: 36px;
            height: 36px;
            color: #c62828;
        }

        .error-state h2 {
            color: #c62828;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .error-state p {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .btn-retry {
            display: inline-block;
            padding: 14px 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="logo">
            <svg viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="3"/>
                <circle cx="20" cy="20" r="8" fill="currentColor"/>
                <path d="M20 2V10M20 30V38M2 20H10M30 20H38" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span>Tracify</span>
        </a>

        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <h2>Verifying your payment...</h2>
            <p>Please wait while we confirm your subscription.</p>
        </div>

        <!-- Success State -->
        <div class="success-state" id="successState">
            <div class="success-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            <h2>Payment Successful!</h2>
            <p>Welcome to Tracify! Your 24-hour trial is now active.</p>
            <p class="redirect-text">Redirecting to your dashboard...</p>
        </div>

        <!-- Error State -->
        <div class="error-state" id="errorState">
            <div class="error-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
            </div>
            <h2>Verification Failed</h2>
            <p id="errorText">Something went wrong verifying your payment.</p>
            <a href="/payment" class="btn-retry">Try Again</a>
        </div>
    </div>

    <script>
        async function verifyPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');

            if (!sessionId) {
                showError('No payment session found. Please try again.');
                return;
            }

            try {
                const res = await fetch(`/api/payment/verify-session?session_id=${encodeURIComponent(sessionId)}`, {
                    credentials: 'include'
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showSuccess();

                    // Fire Google Ads conversion tracking
                    if (typeof gtag === 'function') {
                        gtag('event', 'conversion', {
                            'send_to': 'AW-17960473005/l7lvCKaN8J4cEK2jnPRC',
                            'value': 1.0,
                            'currency': 'USD'
                        });
                    }

                    // Redirect to dashboard after a short delay
                    setTimeout(() => {
                        window.location.href = data.redirectTo || '/dashboard';
                    }, 2000);
                } else {
                    showError(data.error || 'Payment verification failed.');
                }
            } catch (error) {
                console.error('Verification error:', error);
                showError('Connection error. Please check your internet and try again.');
            }
        }

        function showSuccess() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
        }

        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }

        // Start verification on page load
        verifyPayment();
    </script>
</body>
</html>
